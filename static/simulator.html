<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scanner Simulator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="page-sim">
  <div class="sim-wrap">
    <header class="sim-header">
      <h1>Scanner Simulator</h1>
      <p>One entry scanner feeds the line. Each scan pushes that product onto bench 1 (step 1) and shifts the others one bench forward. Scan several in a row to watch the pipeline fill.</p>
    </header>

    <div class="sim-quick">
      <span class="sim-label">Scan a part:</span>
      <span id="partButtons"></span>
      <button data-raw="P99999" class="danger">Unknown</button>
      <button data-raw="random junk" class="danger">Garbage</button>
    </div>

    <div class="sim-card">
      <div class="sim-input-row">
        <input type="text" id="rawInput" placeholder="raw scan text (e.g. P82301)" />
        <button id="sendBtn">Send scan</button>
      </div>
      <div class="sim-actions" id="displayLinks"></div>
    </div>

    <div class="sim-line">
      <div class="sim-line-head">
        <span>LINE</span>
        <button id="resetBtn" class="reset-btn">Reset line</button>
      </div>
      <div id="simLineBody" class="sim-line-body">Line empty.</div>
    </div>

    <div class="sim-console">
      <h3>Recent activity</h3>
      <div id="log"></div>
    </div>
  </div>

  <script>
    async function init() {
      const cfg = await (await fetch('/api/config')).json();
      const pb = document.getElementById('partButtons');
      (cfg.parts || []).forEach(p => {
        const b = document.createElement('button');
        b.dataset.raw = 'P' + p.code;
        b.textContent = `P${p.code} (${p.steps} steps)`;
        pb.appendChild(b);
      });
      const links = document.getElementById('displayLinks');
      (cfg.displays || []).forEach(d => {
        const a = document.createElement('a');
        a.className = 'sim-link'; a.href = '/display/' + encodeURIComponent(d.id); a.target = '_blank';
        a.textContent = `Open ${d.id} →`;
        links.appendChild(a);
      });
      document.querySelectorAll('.sim-quick button, #partButtons button').forEach(btn => {
        btn.addEventListener('click', () => sendScan(btn.dataset.raw));
      });
      document.getElementById('sendBtn').addEventListener('click', () => {
        const v = document.getElementById('rawInput').value.trim();
        if (v) sendScan(v); document.getElementById('rawInput').value = '';
      });
      document.getElementById('rawInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });
      document.getElementById('resetBtn').addEventListener('click', async () => {
        await fetch('/api/reset', { method: 'POST' }); logEntry('↺ line reset', 'ok');
      });
      refresh(); setInterval(refresh, 700);
    }

    async function sendScan(raw) {
      logEntry(`→ "${raw}"`);
      try {
        const data = await (await fetch('/api/scan', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ raw })
        })).json();
        if (data.ok) logEntry(`  ✓ ${data.outcome} — ${data.part_code} (${data.total_steps} steps)`, 'ok');
        else logEntry(`  ✗ ${data.error}`, 'err');
      } catch (e) { logEntry('  ✗ network error', 'err'); }
    }

    async function refresh() {
      try {
        const snap = await (await fetch('/api/snapshots')).json();
        const pos = snap.positions || [];
        const parts = pos.map(p => p.state === 'display'
          ? `${p.display_id}: ${p.part_code} step ${p.step_index}/${p.total_steps}`
          : `${p.display_id}: —`);
        document.getElementById('simLineBody').textContent = parts.join('   |   ') || 'Line empty.';
      } catch (e) {}
    }

    function logEntry(msg, cls) {
      const log = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'log-line ' + (cls || '');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.prepend(line);
      while (log.children.length > 30) log.removeChild(log.lastChild);
    }

    init();
  </script>
</body>
</html>
